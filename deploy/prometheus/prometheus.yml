# Prometheus scrape configuration for ResumeX
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "resumex"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["resumex:8000"]
        labels:
          app: "resumex-ml-service"
          env: "production"
