# docker-compose.yml — ResumeX local development
#
# Usage:
#   docker-compose up --build       (first time or after code changes)
#   docker-compose up               (subsequent runs — uses cached image)
#   docker-compose down             (stop and remove containers)
#
# App will be available at: http://localhost:8000
# Health check:             http://localhost:8000/health

version: '3.9'

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - resumex
      - grafana

  resumex:
    build:
      context: .
      dockerfile: Dockerfile
    image: resumex:latest
    container_name: resumex

    volumes:
      # Persist downloaded HuggingFace models across container restarts.
      # First run: models download (~530 MB, ~60-90 seconds).
      # Subsequent runs: load from this volume — fast startup.
      - resumex-models:/root/.cache/huggingface

    environment:
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - HF_HOME=/root/.cache/huggingface
      - LOG_LEVEL=INFO

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # Allow time for model download on first run

  # ── Prometheus (Time-Series Metrics Collection) ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 150M
    depends_on:
      - resumex

  # ── Grafana (Real-Time Visual Dashboards) ──────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      resources:
        limits:
          memory: 150M
    depends_on:
      - prometheus

volumes:
  resumex-models:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
